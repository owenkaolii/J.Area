<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F5F3EE;--surface:#FFFFFF;--border:#E2DDD4;--border2:#C8C3B8;--text:#1A1814;--muted:#7A756C;--input:#FAFAF7;--green:#166534;--greenbg:#F0FDF4;--amber:#92400E;--amberbg:#FFFBEB;--blue:#1E4E8C;--bluebg:#EFF5FC;--font:'DM Sans',sans-serif;--display:'Space Grotesk',sans-serif;--radius:12px}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;max-width:680px;margin:0 auto;padding:1.1rem 1rem 5.5rem;font-size:15px}
header{background:var(--text);margin:-1.1rem -1rem 1.2rem;padding:1.1rem 1.2rem 1.2rem;color:#fff;position:sticky;top:0;z-index:10}
.home-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px 6px 10px;margin-bottom:11px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.14);border-radius:8px;color:rgba(255,255,255,0.65);font-size:11px;font-weight:600;letter-spacing:0.3px;text-decoration:none}
.home-btn:hover{background:rgba(255,255,255,0.14);color:#fff}
.home-btn svg{width:13px;height:13px}
h1{font-family:var(--display);font-size:22px;font-weight:600}
.crumb{font-size:12.5px;color:rgba(255,255,255,0.6);margin-top:4px}
.crumb b{color:#fff;font-weight:500}.crumb a{color:rgba(255,255,255,0.6);text-decoration:none;cursor:pointer}.crumb a:hover{color:#fff}
.summary{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.scard{flex:1;min-width:88px;background:var(--surface);border:0.5px solid var(--border2);border-radius:10px;padding:9px 11px}
.scard .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em}
.scard .v{font-family:var(--display);font-size:18px;font-weight:600}
.scard .v.money{color:var(--green);font-size:14px}
.toolbar{display:flex;gap:8px;margin-bottom:0.9rem;align-items:center}
.search{flex:1;background:var(--input);border:0.5px solid var(--border2);border-radius:9px;padding:9px 12px;font-family:var(--font);font-size:14px;color:var(--text)}
.card{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--radius);padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .12s}
.card:hover{border-color:var(--muted)}.card.flat{cursor:default}.card.flat:hover{border-color:var(--border2)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .nm{font-family:var(--display);font-size:16px;font-weight:600}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;flex-shrink:0}
.badge.ongoing{background:var(--bluebg);color:var(--blue)}.badge.completed{background:var(--greenbg);color:var(--green)}
.badge.ctype{background:var(--amberbg);color:var(--amber)}.badge.hook{background:var(--amberbg);color:var(--amber)}
.badge.cat{background:#EEF2F6;color:#475569}
.card .stat{font-family:var(--display);font-size:14px;font-weight:600;color:var(--green);margin-top:6px}
.card .sub2{font-size:12px;color:var(--muted);margin-top:3px}
.arrow{color:var(--border2);font-size:20px;align-self:center}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:2.2rem 1rem;border:1px dashed var(--border2);border-radius:var(--radius);line-height:1.6}
.fab{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);max-width:680px;width:calc(100% - 2rem);display:flex;gap:8px;z-index:20}
.fab .btn{flex:1;box-shadow:0 4px 14px rgba(0,0,0,0.13)}
.btn{font-family:var(--display);font-weight:600;font-size:14px;padding:12px;border-radius:11px;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer}

.thumb{width:100%;max-height:160px;object-fit:cover;border-radius:9px;border:1px solid var(--border);margin:8px 0;display:block;cursor:pointer}

.miniadd{font-size:12.5px;color:var(--blue);cursor:pointer;margin-top:10px;display:inline-block;font-weight:600}
.warn{background:var(--amberbg);border:0.5px solid #F0E0C0;border-radius:9px;padding:9px 11px;font-size:12px;color:var(--amber);margin-bottom:10px;line-height:1.5}.warn b{cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(20,18,15,0.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.on{display:flex}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;padding:20px;max-width:680px;width:100%;max-height:92vh;overflow-y:auto}
.sheet h2{font-family:var(--display);font-size:19px;font-weight:600;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--input);border:1px solid var(--border2);border-radius:9px;padding:10px 12px;font-family:var(--font);font-size:15px;color:var(--text)}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}
.row2{display:flex;gap:10px}.row2 .field{flex:1}
.sheet .btnrow{margin-top:8px}
.del-btn{color:#991B1B;background:none;border:none;font-size:13px;cursor:pointer;font-family:var(--font);padding:8px 0;font-weight:500}
.opt{font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.seg{display:flex;border:1px solid var(--border2);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:9px;border:none;background:var(--input);font-family:var(--font);font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--text);color:#fff;font-weight:600}
.cov{background:var(--bluebg);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--blue);margin-top:6px;font-family:var(--display)}
.livecalc{background:var(--greenbg);border:0.5px solid #CDE9D5;border-radius:9px;padding:11px 12px;margin-top:8px}
.livecalc .lc{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.livecalc .lc .v{font-family:var(--display);font-weight:600}
.livecalc .lc.head .v{color:var(--green);font-size:16px}
</style>
</head>

700,"covMin":9.8,"covMax":13.0},{"code":"jotaroof20","product":"JOTAROOF","category":"Exterior","size":20.0,"price":1843400,"covMin":9.8,"covMax":13.0},{"code":"puco2,5","product":"MAJESTIC PURE COLOR","category":"Interior","size":2.5,"price":385350,"covMin":10.5,"covMax":14.0},{"code":"puco20","product":"MAJESTIC PURE COLOR","category":"Interior","size":20.0,"price":2814000,"covMin":10.5,"covMax":14.0},{"code":"sense2,5","product":"MAJESTIC SENSE","category":"Interior","size":2.5,"price":353100,"covMin":5.9,"covMax":8.2},{"code":"sense20","product":"MAJESTIC SENSE","category":"Interior","size":20.0,"price":2583000,"covMin":5.9,"covMax":8.2},{"code":"tbsheen2,5","product":"MAJESTIC TRUE BEAUTY SHEEN","category":"Interior","size":2.5,"price":334500,"covMin":9.0,"covMax":12.0},{"code":"tbsheen20","product":"MAJESTIC TRUE BEAUTY SHEEN","category":"Interior","size":20.0,"price":2317900,"covMin":9.0,"covMax":12.0},{"code":"tbmatt2,5","product":"MAJESTIC TRUE BEAUTY MATT","category":"Interior","size":2.5,"price":279400,"covMin":9.0,"covMax":12.0},{"code":"tbmatt20","product":"MAJESTIC TRUE BEAUTY MATT","category":"Interior","size":20.0,"price":2047000,"covMin":9.0,"covMax":12.0},{"code":"coverplus3,5","product":"ESSENCE COVER PLUS","category":"Interior","size":3.5,"price":301000,"covMin":8.7,"covMax":11.6},{"code":"coverplus18","product":"ESSENCE COVER PLUS","category":"Interior","size":18.0,"price":1346800,"covMin":8.7,"covMax":11.6},{"code":"easywipe3,5","product":"ESSENCE EASY WIPE","category":"Interior","size":3.5,"price":230300,"covMin":9.3,"covMax":11.3},{"code":"easywipe18","product":"ESSENCE EASY WIPE","category":"Interior","size":18.0,"price":1087900,"covMin":9.3,"covMax":11.3},{"code":"jotaplast3,5","product":"JOTAPLAST","category":"Interior","size":3.5,"price":175800,"covMin":9.0,"covMax":12.0},{"code":"jotaplast18","product":"JOTAPLAST","category":"Interior","size":18.0,"price":811000,"covMin":9.0,"covMax":12.0},{"code":"cito2,5","product":"CITO PRIMER","category":"Primer","size":2.5,"price":270700,"covMin":6.3,"covMax":8.3},{"code":"cito20","product":"CITO PRIMER","category":"Primer","size":20.0,"price":2153700,"covMin":6.3,"covMax":8.3},{"code":"ultraprimer2,5","product":"ULTRA PRIMER","category":"Primer","size":2.5,"price":230500,"covMin":8.0,"covMax":10.7},{"code":"ultraprimer20","product":"ULTRA PRIMER","category":"Primer","size":20.0,"price":1778800,"covMin":8.0,"covMax":10.7},{"code":"jotashieldprimer2,5","product":"JOTASHIELD PRIMER","category":"Primer","size":2.5,"price":170600,"covMin":8.0,"covMax":10.7},{"code":"jotashieldprimer20","product":"JOTASHIELD PRIMER","category":"Primer","size":20.0,"price":1321900,"covMin":8.0,"covMax":10.7},{"code":"majesticprimer2,5","product":"MAJESTIC PRIMER","category":"Primer","size":2.5,"price":160200,"covMin":8.0,"covMax":10.7},{"code":"majesticprimer20","product":"MAJESTIC PRIMER","category":"Primer","size":20.0,"price":1214000,"covMin":8.0,"covMax":10.7},{"code":"toughshieldprimer3,5","product":"TOUGH SHIELD PRIMER","category":"Primer","size":3.5,"price":203300,"covMin":8.8,"covMax":11.6},{"code":"toughshieldprimer18","product":"TOUGH SHIELD PRIMER","category":"Primer","size":18.0,"price":965200,"covMin":8.8,"covMax":11.6},{"code":"easyprimer3,5","product":"ESSENCE EASY PRIMER","category":"Primer","size":3.5,"price":193100,"covMin":8.8,"covMax":11.6},{"code":"easyprimer18","product":"ESSENCE EASY PRIMER","category":"Primer","size":18.0,"price":916900,"covMin":8.8,"covMax":11.6},{"code":"jotaplastprimer3,5","product":"JOTAPLAST PRIMER","category":"Primer","size":3.5,"price":136300,"covMin":9.0,"covMax":12.0},{"code":"jotaplastprimer18","product":"JOTAPLAST PRIMER","category":"Primer","size":18.0,"price":614900,"covMin":9.0,"covMax":12.0},{"code":"gardexprimer1","product":"GARDEX PRIMER","category":"Primer","size":1.0,"price":90200,"covMin":10.0,"covMax":17.0},{"code":"gardexprimer5","product":"GARDEX PRIMER","category":"Primer","size":5.0,"price":482000,"covMin":10.0,"covMax":17.0},{"code":"gardex0,9","product":"GARDEX PREMIUM GLOSS","category":"W&M","size":0.9,"price":121600,"covMin":12.0,"covMax":16.0},{"code":"gardex5","product":"GARDEX PREMIUM GLOSS","category":"W&M","size":5.0,"price":611200,"covMin":12.0,"covMax":16.0},{"code":"majesticsf0,9","product":"MAJESTIC SUPREME FINISH","category":"W&M","size":0.9,"price":155500,"covMin":9.5,"covMax":12.7},{"code":"majesticsf5","product":"MAJESTIC SUPREME FINISH","category":"W&M","size":5.0,"price":775550,"covMin":9.5,"covMax":12.7},{"code":"majesticsfprimer0,9","product":"MAJESTIC PRIMER WOOD & METAL","category":"W&M Primer","size":0.9,"price":94700,"covMin":7.8,"covMax":13.0},{"code":"majesticsfprimer5","product":"MAJESTIC PRIMER WOOD & METAL","category":"W&M Primer","size":5.0,"price":429200,"covMin":7.8,"covMax":13.0}];

const CATS=['Exterior','Interior','Primer','W&M','W&M Primer'];
function coatsFor(cat){return (cat==='Primer'||cat==='W&M Primer')?1:2;}
function sizeLabel(s){return s+'L '+(s>=15?'pail':'can');}
function catItem(code){return CATALOG.find(c=>c.code===code);}
function prodsIn(cat){const seen={};const out=[];for(const c of CATALOG)if(c.category===cat&&!seen[c.product]){seen[c.product]=1;out.push(c.product);}return out;}
function sizesOf(cat,product){return CATALOG.filter(c=>c.category===cat&&c.product===product);}

const KEY='jproj_v4';
let DB=load()||{prices:{},customers:[]};
if(!DB.prices)DB.prices={};
let view={level:'customers',custId:null,projId:null,htId:null};
let search='';

function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){alert('Storage full — export a JSON backup and remove some photos.');}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmt(n){return Math.round(n||0).toLocaleString('en-US');}
function f2(n){return (Math.round((n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
const $=id=>document.getElementById(id);
function esc(s){return (s==null?'':''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cust(id){return DB.customers.find(c=>c.id===id);}
function proj(c,id){return c?c.projects.find(p=>p.id===id):null;}
function basePrice(code){return DB.prices[code]!=null?DB.prices[code]:(catItem(code)?catItem(code).price:0);}

/* ---------- CALC: m² → liters → packs → price, min/avg/max (exact) ---------- */
function lineCalc(pl){
  const ci=catItem(pl.code);if(!ci)return null;
  const coats=coatsFor(ci.category);
  const sqm=pl.sqm||0;
  const price=pl.price!=null?pl.price:basePrice(pl.code);
  const covAvg=(ci.covMin+ci.covMax)/2;
  // min coverage => most paint (high); max coverage => least paint (low)
  const Lavg=sqm*coats/covAvg, Lhigh=sqm*coats/ci.covMin, Llow=sqm*coats/ci.covMax;
  const pAvg=Lavg/ci.size, pLow=Llow/ci.size, pHigh=Lhigh/ci.size;
  return {ci,coats,sqm,price,covAvg,
    litersAvg:Lavg,litersLow:Llow,litersHigh:Lhigh,
    packsAvg:pAvg,packsLow:pLow,packsHigh:pHigh,
    costAvg:pAvg*price,costLow:pLow*price,costHigh:pHigh*price};
}
function htTotals(ht){let avg=0,low=0,high=0;for(const pl of ht.paints||[]){const c=lineCalc(pl);if(!c)continue;avg+=c.costAvg;low+=c.costLow;high+=c.costHigh;}return {avg,low,high};}
function projValue(p){let v=0;for(const ht of p.houseTypes||[])v+=htTotals(ht).avg;return v;}
function projPaint(p){const agg={};for(const ht of p.houseTypes||[])for(const pl of ht.paints||[]){const c=lineCalc(pl);if(!c)continue;
  const key=c.ci.product+' '+sizeLabel(c.ci.size)+(pl.color?' · '+pl.color:'');
  if(!agg[key])agg[key]={sqm:0,packsAvg:0,costAvg:0};agg[key].sqm+=c.sqm;agg[key].packsAvg+=c.packsAvg;agg[key].costAvg+=c.costAvg;}return agg;}
function custValue(c){return (c.projects||[]).reduce((s,p)=>s+projValue(p),0);}

/* ---------- RENDER ---------- */
function render(){({customers:renderCustomers,customer:renderCustomer,project:renderProject,housetype:renderHT,products:renderProducts})[view.level]();save();}
function setCrumb(html,title){$('crumb').innerHTML=html;$('title').textContent=title;}

function renderCustomers(){
  setCrumb('Customers and their projects','Project Records');
  let tp=0,tv=0;for(const c of DB.customers){tp+=c.projects.length;tv+=custValue(c);}
  let h=`<div class="summary">
    <div class="scard"><div class="k">Customers</div><div class="v">${DB.customers.length}</div></div>
    <div class="scard"><div class="k">Projects</div><div class="v">${tp}</div></div>
    <div class="scard"><div class="k">Paint Value</div><div class="v money">Rp ${fmt(tv)}</div></div></div>`;
  h+=`<div class="toolbar"><input class="search" id="search" placeholder="Search customer..." value="${esc(search)}"><button class="btn sm" onclick="goProducts()">Prices</button></div>`;
  const list=DB.customers.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
  if(!DB.customers.length)h+=`<div class="empty">No customers yet.<br>Add your first customer to start recording won projects.</div>`;
  else if(!list.length)h+=`<div class="empty">No customer matches "${esc(search)}".</div>`;
  for(const c of list){const ong=c.projects.filter(p=>p.status!=='completed').length;
    h+=`<div class="card" onclick="openCust('${c.id}')"><div class="top"><div>
      <div class="nm">${esc(c.name)}</div>
      <div class="meta">${c.custType?`<span class="badge ctype">${c.custType}</span> `:''}${esc(c.location||'')}${c.contact?` · ${esc(c.contact)}`:''}</div>
      <div class="sub2">${c.projects.length} project${c.projects.length!==1?'s':''}${ong?` · ${ong} ongoing`:''}</div>
      <div class="stat">Rp ${fmt(custValue(c))}</div></div><div class="arrow">›</div></div></div>`;}
  $('app').innerHTML=h;

}

  h+=`<div><span class="miniadd" onclick="editPaint('${ht.id}')">+ add paint line</span></div>`;

}

  openSheet(`<h2>${esc(it.product)}</h2>

/* ---------- PAINT LINE: cascade + live calc ---------- */
let plDraft={cat:'Exterior',product:'',code:'',color:'',colorHex:'#e5e0d8',sqm:'',price:null};
window.editPaint=(htId,idx)=>{const c=cust(view.custId),p=proj(c,view.projId),ht=p.houseTypes.find(h=>h.id===htId);
  const pl=(idx!==undefined&&idx!==null)?ht.paints[idx]:null;
  if(pl){const ci=catItem(pl.code);plDraft={cat:ci.category,product:ci.product,code:pl.code,color:pl.color||'',colorHex:pl.colorHex||'#e5e0d8',sqm:pl.sqm||'',price:pl.price};}
  else plDraft={cat:'Exterior',product:prodsIn('Exterior')[0],code:'',color:'',colorHex:'#e5e0d8',sqm:'',price:null};
  if(!plDraft.code){const sz=sizesOf(plDraft.cat,plDraft.product);plDraft.code=sz[0].code;plDraft.price=basePrice(sz[0].code);}
  renderPaintSheet(htId,idx);};
function renderPaintSheet(htId,idx){
  const d=plDraft;
  const catOpts=CATS.map(ct=>`<option ${d.cat===ct?'selected':''}>${ct}</option>`).join('');
  const prodOpts=prodsIn(d.cat).map(pr=>`<option ${d.product===pr?'selected':''}>${esc(pr)}</option>`).join('');
  const sizeOpts=sizesOf(d.cat,d.product).map(it=>`<option value="${it.code}" ${d.code===it.code?'selected':''}>${sizeLabel(it.size)} — Rp ${fmt(basePrice(it.code))}</option>`).join('');
  const ci=catItem(d.code);
  const cov=ci?`<div class="cov">Coverage ${ci.covMin}–${ci.covMax} m²/L per coat · ${coatsFor(ci.category)} coat${coatsFor(ci.category)>1?'s':''} (TDS)</div>`:'';
  let live='';
  if(ci&&d.sqm){const c=lineCalc({code:d.code,sqm:parseFloat(d.sqm)||0,price:d.price});
    live=`<div class="livecalc"><div class="lc head"><span>Paint needed (avg)</span><span class="v">${f2(c.litersAvg)} L</span></div>
      <div class="lc"><span>Packs (${sizeLabel(ci.size)})</span><span class="v">${f2(c.packsAvg)}</span></div>
      <div class="lc head"><span>Cost (avg)</span><span class="v">Rp ${fmt(c.costAvg)}</span></div>
      <div class="lc"><span style="color:var(--muted);font-size:11px">Range (lean–safe)</span><span class="v" style="font-size:11px;color:var(--muted)">Rp ${fmt(c.costLow)} – ${fmt(c.costHigh)}</span></div></div>`;}
  openSheet(`<h2>${idx!=null&&idx!==undefined?'Edit':'New'} paint line</h2>
    <div class="field"><label>Category</label><select id="d_cat" onchange="plCat(this.value)">${catOpts}</select></div>
    <div class="field"><label>Product</label><select id="d_prod" onchange="plProd(this.value)">${prodOpts}</select></div>
    <div class="field"><label>Size</label><select id="d_size" onchange="plSize(this.value)">${sizeOpts}</select>${cov}</div>
    <div class="row2"><div class="field"><label>Colour <span class="opt">label</span></label><input id="d_color" value="${esc(d.color)}" oninput="plField('color',this.value)" placeholder="e.g. 1624 White"></div>
    <div class="field"><label>Swatch</label><input id="d_hex" type="color" value="${d.colorHex}" oninput="plField('colorHex',this.value)" style="height:44px;padding:4px"></div></div>
    <div class="field"><label>Area for this colour (m²)</label><input id="d_sqm" type="number" step="0.01" value="${d.sqm}" oninput="plSqm(this.value)" placeholder="m² this colour covers"></div>
    <div class="field"><label>Price per ${ci?sizeLabel(ci.size):'pack'} (Rp) <span class="opt">prefilled — edit for tinted colours</span></label><input id="d_price" type="number" value="${d.price!=null?d.price:''}" oninput="plField('price',this.value===''?null:parseInt(this.value))"></div>
    <div id="d_live">${live}</div>
    <div class="btnrow"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn gold" style="flex:1" onclick="savePaint('${htId}',${idx==null?'null':idx})">Save</button></div>`);}
function refreshLive(){const d=plDraft,ci=catItem(d.code);const box=$('d_live');if(!box)return;
  if(ci&&d.sqm){const c=lineCalc({code:d.code,sqm:parseFloat(d.sqm)||0,price:d.price});
    box.innerHTML=`<div class="livecalc"><div class="lc head"><span>Paint needed (avg)</span><span class="v">${f2(c.litersAvg)} L</span></div>
      <div class="lc"><span>Packs (${sizeLabel(ci.size)})</span><span class="v">${f2(c.packsAvg)}</span></div>
      <div class="lc head"><span>Cost (avg)</span><span class="v">Rp ${fmt(c.costAvg)}</span></div>
      <div class="lc"><span style="color:var(--muted);font-size:11px">Range (lean–safe)</span><span class="v" style="font-size:11px;color:var(--muted)">Rp ${fmt(c.costLow)} – ${fmt(c.costHigh)}</span></div></div>`;}
  else box.innerHTML='';}
window.plCat=v=>{plDraft.cat=v;plDraft.product=prodsIn(v)[0];const sz=sizesOf(v,plDraft.product);plDraft.code=sz[0].code;plDraft.price=basePrice(sz[0].code);
  // rerender selects that depend on category
  const d=plDraft;$('d_prod').innerHTML=prodsIn(d.cat).map(pr=>`<option ${d.product===pr?'selected':''}>${esc(pr)}</option>`).join('');
  plProd(d.product);};
window.plProd=v=>{plDraft.product=v;const sz=sizesOf(plDraft.cat,v);plDraft.code=sz[0].code;plDraft.price=basePrice(sz[0].code);
  const d=plDraft;$('d_size').innerHTML=sz.map(it=>`<option value="${it.code}" ${d.code===it.code?'selected':''}>${sizeLabel(it.size)} — Rp ${fmt(basePrice(it.code))}</option>`).join('');
  plSize(d.code);};
window.plSize=v=>{plDraft.code=v;plDraft.price=basePrice(v);if($('d_price'))$('d_price').value=plDraft.price;
  const ci=catItem(v);// refresh coverage note + price label by re-rendering minimal
  const covEl=document.querySelector('.cov');if(covEl&&ci)covEl.textContent=`Coverage ${ci.covMin}–${ci.covMax} m²/L per coat · ${coatsFor(ci.category)} coat${coatsFor(ci.category)>1?'s':''} (TDS)`;
  refreshLive();};
window.plField=(k,v)=>{plDraft[k]=v;if(k==='price')refreshLive();};
window.plSqm=v=>{plDraft.sqm=v;refreshLive();};
window.savePaint=(htId,idx)=>{const c=cust(view.custId),p=proj(c,view.projId),ht=p.houseTypes.find(h=>h.id===htId);const d=plDraft;
  if(!d.sqm||!(parseFloat(d.sqm)>0)){$('d_sqm').focus();return;}
  const data={code:d.code,color:d.color.trim(),colorHex:d.colorHex,sqm:parseFloat(d.sqm),price:d.price};
  if(!ht.paints)ht.paints=[];
  if(idx!=null&&idx!==undefined)Object.assign(ht.paints[idx],data);else ht.paints.push(data);
  closeSheet();render();};
window.delPaint=(htId,idx)=>{const c=cust(view.custId),p=proj(c,view.projId),ht=p.houseTypes.find(h=>h.id===htId);ht.paints.splice(idx,1);render();};

/* ---------- PHOTO ---------- */
window.addPhoto=htId=>{const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{const max=900;let w=img.width,h=img.height;
      if(w>h&&w>max){h=h*max/w;w=max;}else if(h>max){w=w*max/h;h=max;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      const c=cust(view.custId),p=proj(c,view.projId),ht=p.houseTypes.find(x=>x.id===htId);ht.photo=cv.toDataURL('image/jpeg',0.55);render();
    };img.src=r.result;};r.readAsDataURL(f);};i.click();};
window.rmPhoto=htId=>{const c=cust(view.custId),p=proj(c,view.projId),ht=p.houseTypes.find(x=>x.id===htId);ht.photo=null;render();};
window.viewPhoto=htId=>{const c=cust(view.custId),p=proj(c,view.projId),ht=p.houseTypes.find(x=>x.id===htId);
  openSheet(`<h2>${esc(ht.name)} — plan</h2><img src="${ht.photo}" style="width:100%;border-radius:10px"><div class="btnrow"><button class="btn gold" style="flex:1" onclick="closeSheet()">Close</button></div>`);};

/* ---------- EXPORT ---------- */
function csvCell(s){s=(s==null?'':''+s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
window.exportCSV=()=>{
  const rows=[['Customer','Type','Contact','Phone','Cust Location','Project','Proj Location','Date Won','Status','House Type','Variant','Units','Category','Product','Size','Colour','m2','Coats','Litres avg','Packs avg','Price/pack','Cost avg','Cost low','Cost high']];
  for(const c of DB.customers)for(const p of c.projects){const pb=[c.name,c.custType,c.contact,c.phone,c.location,p.name,p.location,p.dateWon,p.status];
    if(!(p.houseTypes||[]).length){rows.push([...pb,...Array(15).fill('')]);continue;}
    for(const ht of p.houseTypes){const hb=[...pb,ht.name,ht.variant,ht.units];
      if(!(ht.paints||[]).length){rows.push([...hb,...Array(12).fill('')]);continue;}
      for(const pl of ht.paints){const cc=lineCalc(pl);if(!cc){continue;}
        rows.push([...hb,cc.ci.category,cc.ci.product,sizeLabel(cc.ci.size),pl.color,cc.sqm,cc.coats,cc.litersAvg.toFixed(2),cc.packsAvg.toFixed(2),cc.price,Math.round(cc.costAvg),Math.round(cc.costLow),Math.round(cc.costHigh)]);}
    }}
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project-records-'+new Date().toISOString().slice(0,10)+'.csv';a.click();};
window.exportJSON=()=>{const blob=new Blob([JSON.stringify(DB)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project-records-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();};
window.importJSON=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);if(!DB.prices)DB.prices={};save();goCustomers();}catch(x){alert('Bad file');}};r.readAsText(f);};i.click();};

render();
</script>
</body>
</html>
