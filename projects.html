<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Records — Jotun Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F3EE;--surface:#FFFFFF;--border:#E2DDD4;--border2:#C8C3B8;
  --text:#1A1814;--muted:#7A756C;--input:#FAFAF7;
  --green:#166534;--greenbg:#F0FDF4;--amber:#92400E;--amberbg:#FFFBEB;--blue:#1E4E8C;--bluebg:#EFF5FC;
  --font:'DM Sans',sans-serif;--display:'Space Grotesk',sans-serif;--radius:12px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;max-width:680px;margin:0 auto;padding:1.1rem 1rem 5rem;font-size:15px}
header{background:var(--text);margin:-1.1rem -1rem 1.2rem;padding:1.1rem 1.2rem 1.2rem;color:#fff;position:sticky;top:0;z-index:10}
.home-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px 6px 10px;margin-bottom:11px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.14);border-radius:8px;color:rgba(255,255,255,0.65);font-size:11px;font-weight:600;letter-spacing:0.3px;text-decoration:none;transition:all 0.15s}
.home-btn:hover{background:rgba(255,255,255,0.14);color:#fff}
.home-btn svg{width:13px;height:13px}
h1{font-family:var(--display);font-size:22px;font-weight:600}
.crumb{font-size:12.5px;color:rgba(255,255,255,0.6);margin-top:4px}
.crumb b{color:#fff;font-weight:500}
.crumb a{color:rgba(255,255,255,0.6);text-decoration:none}.crumb a:hover{color:#fff}

.summary{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.scard{flex:1;min-width:90px;background:var(--surface);border:0.5px solid var(--border2);border-radius:10px;padding:9px 11px}
.scard .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em}
.scard .v{font-family:var(--display);font-size:18px;font-weight:600}
.scard .v.money{color:var(--green);font-size:15px}

.toolbar{display:flex;gap:8px;margin-bottom:0.9rem;align-items:center}
.search{flex:1;background:var(--input);border:0.5px solid var(--border2);border-radius:9px;padding:9px 12px;font-family:var(--font);font-size:14px;color:var(--text)}
.chip{font-size:12px;padding:6px 11px;border-radius:20px;border:1px solid var(--border2);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}

.card{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--radius);padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .12s}
.card:hover{border-color:var(--muted)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .nm{font-family:var(--display);font-size:16px;font-weight:600}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;flex-shrink:0}
.badge.ongoing{background:var(--bluebg);color:var(--blue)}
.badge.completed{background:var(--greenbg);color:var(--green)}
.badge.ctype{background:var(--amberbg);color:var(--amber)}
.card .stat{font-family:var(--display);font-size:14px;font-weight:600;color:var(--green);margin-top:6px}
.card .sub2{font-size:12px;color:var(--muted);margin-top:3px}
.arrow{color:var(--border2);font-size:20px;align-self:center}

.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:2.4rem 1rem;border:1px dashed var(--border2);border-radius:var(--radius);line-height:1.6}

.fab{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:680px;width:calc(100% - 2rem);display:flex;gap:8px;z-index:20}
.fab .btn{flex:1;box-shadow:0 4px 14px rgba(0,0,0,0.12)}
.btn{font-family:var(--display);font-weight:600;font-size:14px;padding:12px;border-radius:11px;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer}
.btn.gold{background:var(--text);color:#fff;border-color:var(--text)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btnrow{display:flex;gap:7px;flex-wrap:wrap}

.section-label{font-family:var(--display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin:1.2rem 0 0.6rem}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--border);font-size:14px}
.kv:first-child{border-top:none}.kv .k{color:var(--muted)}.kv .v{font-weight:500;text-align:right}

.ht{background:var(--surface);border:0.5px solid var(--border2);border-radius:11px;padding:12px;margin-bottom:8px}
.ht .htop{display:flex;justify-content:space-between;align-items:baseline}
.ht .hname{font-family:var(--display);font-size:15px;font-weight:600}
.ht .hunits{font-size:12px;color:var(--muted)}
.paintline{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid var(--border);color:var(--text)}
.paintline:first-of-type{border-top:1px solid var(--border);margin-top:7px}
.paintline .sw{width:13px;height:13px;border-radius:3px;border:1px solid var(--border2);flex-shrink:0}
.paintline .pn{flex:1}
.paintline .pq{font-family:var(--display);font-size:12px;color:var(--muted)}
.paintline .del{color:var(--border2);cursor:pointer;font-weight:700;padding:0 3px}
.paintline .del:hover{color:#991B1B}
.miniadd{font-size:12px;color:var(--blue);cursor:pointer;margin-top:7px;display:inline-block;font-weight:500}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,18,15,0.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
.modal.on{display:flex}
.sheet{background:var(--surface);border-radius:18px 18px 0 0;padding:20px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto}
.sheet h2{font-family:var(--display);font-size:19px;font-weight:600;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--input);border:1px solid var(--border2);border-radius:9px;padding:10px 12px;font-family:var(--font);font-size:15px;color:var(--text)}
.field textarea{resize:vertical;min-height:54px}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}
.row2{display:flex;gap:10px}.row2 .field{flex:1}
.sheet .btnrow{margin-top:8px}
.del-btn{color:#991B1B;background:none;border:none;font-size:13px;cursor:pointer;font-family:var(--font);padding:8px 0;font-weight:500}
.opt{font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
</style>
</head>
<body>
<header>
  <a class="home-btn" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>Tools</a>
  <h1 id="title">Project Records</h1>
  <div class="crumb" id="crumb">Customers and their projects</div>
</header>
<div id="app"></div>
<div class="fab" id="fab"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
"use strict";
const KEY='jproj_v1';
let DB=load()||{customers:[]};
let view={level:'customers', custId:null, projId:null};
let search='', statusFilter='all';

function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmt(n){return (n||0).toLocaleString('en-US');}
const $=id=>document.getElementById(id);

function cust(id){return DB.customers.find(c=>c.id===id);}
function proj(c,id){return c?c.projects.find(p=>p.id===id):null;}
function projValue(p){if(p.estValue)return p.estValue;let v=0;for(const h of p.houseTypes||[])v+=(h.units||0)*(h.valuePerUnit||0);return v;}
function custValue(c){return (c.projects||[]).reduce((s,p)=>s+projValue(p),0);}

/* ---------- RENDER ---------- */
function render(){
  if(view.level==='customers')renderCustomers();
  else if(view.level==='customer')renderCustomer();
  else if(view.level==='project')renderProject();
  save();
}
function setCrumb(html,title){$('crumb').innerHTML=html;$('title').textContent=title;}

function renderCustomers(){
  setCrumb('Customers and their projects','Project Records');
  let totalProj=0,totalVal=0;
  for(const c of DB.customers){totalProj+=c.projects.length;totalVal+=custValue(c);}
  let h=`<div class="summary">
    <div class="scard"><div class="k">Customers</div><div class="v">${DB.customers.length}</div></div>
    <div class="scard"><div class="k">Projects</div><div class="v">${totalProj}</div></div>
    <div class="scard"><div class="k">Est. Value</div><div class="v money">Rp ${fmt(totalVal)}</div></div></div>`;
  h+=`<div class="toolbar"><input class="search" id="search" placeholder="Search customer..." value="${search}"></div>`;
  const list=DB.customers.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
  if(!DB.customers.length){h+=`<div class="empty">No customers yet.<br>Add your first customer to start recording won projects.</div>`;}
  else if(!list.length){h+=`<div class="empty">No customer matches "${search}".</div>`;}
  for(const c of list){
    const ong=c.projects.filter(p=>p.status!=='completed').length;
    h+=`<div class="card" onclick="openCust('${c.id}')"><div class="top"><div>
      <div class="nm">${esc(c.name)}</div>
      <div class="meta">${c.custType?`<span class="badge ctype">${c.custType}</span> `:''}${c.location?esc(c.location):''}${c.contact?` · ${esc(c.contact)}`:''}</div>
      <div class="sub2">${c.projects.length} project${c.projects.length!==1?'s':''}${ong?` · ${ong} ongoing`:''}</div>
      <div class="stat">Rp ${fmt(custValue(c))}</div>
    </div><div class="arrow">›</div></div></div>`;
  }
  $('app').innerHTML=h;
  $('fab').innerHTML=`<button class="btn" onclick="exportCSV()">Export Excel (CSV)</button><button class="btn gold" onclick="editCust()">+ Customer</button>`;
  const s=$('search');if(s)s.oninput=e=>{search=e.target.value;renderCustomers();};
  bindData();
}

function renderCustomer(){
  const c=cust(view.custId);if(!c){view.level='customers';return render();}
  setCrumb(`<a onclick="goCustomers()">Customers</a> › <b>${esc(c.name)}</b>`, c.name);
  let h=`<div class="summary">
    <div class="scard"><div class="k">Projects</div><div class="v">${c.projects.length}</div></div>
    <div class="scard"><div class="k">Est. Value</div><div class="v money">Rp ${fmt(custValue(c))}</div></div></div>`;
  h+=`<div class="card" style="cursor:default" onclick="event.stopPropagation()">
    ${c.custType?`<div class="kv"><span class="k">Type</span><span class="v">${c.custType}</span></div>`:''}
    ${c.contact?`<div class="kv"><span class="k">Contact</span><span class="v">${esc(c.contact)}</span></div>`:''}
    ${c.phone?`<div class="kv"><span class="k">Phone</span><span class="v">${esc(c.phone)}</span></div>`:''}
    ${c.location?`<div class="kv"><span class="k">Location</span><span class="v">${esc(c.location)}</span></div>`:''}
    <div class="btnrow" style="margin-top:10px"><button class="btn sm" onclick="editCust('${c.id}')">Edit customer</button></div></div>`;
  h+=`<div class="section-label">Projects</div>`;
  if(!c.projects.length)h+=`<div class="empty">No projects yet for this customer.</div>`;
  for(const p of [...c.projects].sort((a,b)=>(b.dateWon||'').localeCompare(a.dateWon||''))){
    const types=(p.houseTypes||[]).length;
    h+=`<div class="card" onclick="openProj('${p.id}')"><div class="top"><div>
      <div class="nm">${esc(p.name)}</div>
      <div class="meta">${p.location?esc(p.location)+' · ':''}${p.dateWon||''}</div>
      <div class="sub2">${types} house type${types!==1?'s':''}</div>
      <div class="stat">Rp ${fmt(projValue(p))}</div>
    </div><span class="badge ${p.status==='completed'?'completed':'ongoing'}">${p.status==='completed'?'Completed':'Ongoing'}</span></div></div>`;
  }
  $('app').innerHTML=h;
  $('fab').innerHTML=`<button class="btn" onclick="goCustomers()">‹ Back</button><button class="btn gold" onclick="editProj()">+ Project</button>`;
  bindData();
}

function renderProject(){
  const c=cust(view.custId),p=proj(c,view.projId);if(!p){view.level='customer';return render();}
  setCrumb(`<a onclick="goCustomers()">Customers</a> › <a onclick="openCust('${c.id}')">${esc(c.name)}</a> › <b>${esc(p.name)}</b>`, p.name);
  let paintTotal={};
  for(const ht of p.houseTypes||[])for(const pl of ht.paints||[]){const key=pl.product;paintTotal[key]=(paintTotal[key]||0)+(pl.qtyPerUnit||0)*(ht.units||0);}
  let h=`<div class="card" style="cursor:default">
    <div class="kv"><span class="k">Status</span><span class="v">${p.status==='completed'?'Completed':'Ongoing'}</span></div>
    ${p.location?`<div class="kv"><span class="k">Location</span><span class="v">${esc(p.location)}</span></div>`:''}
    ${p.dateWon?`<div class="kv"><span class="k">Date won</span><span class="v">${p.dateWon}</span></div>`:''}
    <div class="kv"><span class="k">Estimated value</span><span class="v" style="color:var(--green)">Rp ${fmt(projValue(p))}</span></div>
    ${p.notes?`<div class="kv"><span class="k">Notes</span><span class="v" style="max-width:60%">${esc(p.notes)}</span></div>`:''}
    <div class="btnrow" style="margin-top:10px"><button class="btn sm" onclick="editProj('${p.id}')">Edit project</button></div></div>`;
  h+=`<div class="section-label">House Types</div>`;
  if(!(p.houseTypes||[]).length)h+=`<div class="empty">No house types yet.<br>Add a type (e.g. "Tipe 45") with its unit count and paint used.</div>`;
  for(const ht of p.houseTypes||[]){
    h+=`<div class="ht"><div class="htop"><div class="hname">${esc(ht.name)}</div><div class="hunits">${ht.units||0} unit${ht.units!==1?'s':''} · Rp ${fmt((ht.units||0)*(ht.valuePerUnit||0))}</div></div>`;
    for(const pl of ht.paints||[]){
      h+=`<div class="paintline"><span class="sw" style="background:${pl.colorHex||'#ddd'}"></span><span class="pn">${esc(pl.product)}${pl.color?` · <span style="color:var(--muted)">${esc(pl.color)}</span>`:''}</span>${pl.qtyPerUnit?`<span class="pq">${pl.qtyPerUnit}/unit</span>`:''}<span class="del" onclick="delPaint('${ht.id}',${(ht.paints||[]).indexOf(pl)})">✕</span></div>`;
    }
    h+=`<span class="miniadd" onclick="addPaint('${ht.id}')">+ add paint/color</span>
      <div class="btnrow" style="margin-top:9px"><button class="btn sm" onclick="editHT('${ht.id}')">Edit</button><button class="btn sm" onclick="delHT('${ht.id}')" style="color:#991B1B">Delete</button></div></div>`;
  }
  if(Object.keys(paintTotal).length){
    h+=`<div class="section-label">Total paint (all units)</div><div class="card" style="cursor:default">`;
    for(const k in paintTotal)h+=`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${fmt(paintTotal[k])}</span></div>`;
    h+=`</div>`;
  }
  $('app').innerHTML=h;
  $('fab').innerHTML=`<button class="btn" onclick="openCust('${c.id}')">‹ Back</button><button class="btn gold" onclick="editHT()">+ House Type</button>`;
  bindData();
}
function bindData(){}

/* ---------- NAV ---------- */
window.goCustomers=()=>{view={level:'customers',custId:null,projId:null};render();};
window.openCust=id=>{view={level:'customer',custId:id,projId:null};render();};
window.openProj=id=>{view={level:'project',custId:view.custId,projId:id};render();};

/* ---------- MODALS ---------- */
function openSheet(html){$('sheet').innerHTML=html;$('modal').classList.add('on');}
window.closeSheet=()=>$('modal').classList.remove('on');
$('modal').onclick=e=>{if(e.target===$('modal'))closeSheet();};

window.editCust=(id)=>{const c=id?cust(id):null;
  openSheet(`<h2>${c?'Edit':'New'} customer</h2>
    <div class="field"><label>Name</label><input id="f_name" value="${c?esc(c.name):''}" placeholder="e.g. PT Maju Bangun / Pak Sigit"></div>
    <div class="field"><label>Type</label><select id="f_ctype">
      ${['Contractor','Developer','Direct','Reseller','Other'].map(t=>`<option ${c&&c.custType===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="row2"><div class="field"><label>Contact person <span class="opt">optional</span></label><input id="f_contact" value="${c?esc(c.contact||''):''}"></div>
    <div class="field"><label>Phone <span class="opt">optional</span></label><input id="f_phone" value="${c?esc(c.phone||''):''}"></div></div>
    <div class="field"><label>Location / area <span class="opt">optional</span></label><input id="f_loc" value="${c?esc(c.location||''):''}" placeholder="e.g. Batam Centre"></div>
    <div class="btnrow"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn gold" style="flex:1" onclick="saveCust('${id||''}')">Save</button></div>
    ${c?`<button class="del-btn" onclick="delCust('${id}')">Delete customer</button>`:''}`);};
window.saveCust=id=>{const name=$('f_name').value.trim();if(!name){$('f_name').focus();return;}
  const data={name,custType:$('f_ctype').value,contact:$('f_contact').value.trim(),phone:$('f_phone').value.trim(),location:$('f_loc').value.trim()};
  if(id){Object.assign(cust(id),data);}else{DB.customers.push({id:uid(),...data,projects:[]});}
  closeSheet();render();};
window.delCust=id=>{if(confirm('Delete this customer and all their projects?')){DB.customers=DB.customers.filter(c=>c.id!==id);closeSheet();goCustomers();}};

window.editProj=(id)=>{const c=cust(view.custId);const p=id?proj(c,id):null;
  openSheet(`<h2>${p?'Edit':'New'} project</h2>
    <div class="field"><label>Project name</label><input id="f_pname" value="${p?esc(p.name):''}" placeholder="e.g. Perumahan Green Hill"></div>
    <div class="field"><label>Location <span class="opt">optional</span></label><input id="f_ploc" value="${p?esc(p.location||''):''}"></div>
    <div class="row2"><div class="field"><label>Date won <span class="opt">optional</span></label><input id="f_pdate" type="date" value="${p?p.dateWon||'':''}"></div>
    <div class="field"><label>Status</label><select id="f_pstatus"><option value="ongoing" ${p&&p.status==='ongoing'?'selected':''}>Ongoing</option><option value="completed" ${p&&p.status==='completed'?'selected':''}>Completed</option></select></div></div>
    <div class="field"><label>Estimated value (Rp) <span class="opt">optional — auto-sums from house types if blank</span></label><input id="f_pval" type="number" value="${p&&p.estValue?p.estValue:''}" placeholder="leave blank to auto-calc"></div>
    <div class="field"><label>Notes <span class="opt">optional</span></label><textarea id="f_pnotes">${p?esc(p.notes||''):''}</textarea></div>
    <div class="btnrow"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn gold" style="flex:1" onclick="saveProj('${id||''}')">Save</button></div>
    ${p?`<button class="del-btn" onclick="delProj('${id}')">Delete project</button>`:''}`);};
window.saveProj=id=>{const c=cust(view.custId);const name=$('f_pname').value.trim();if(!name){$('f_pname').focus();return;}
  const data={name,location:$('f_ploc').value.trim(),dateWon:$('f_pdate').value,status:$('f_pstatus').value,estValue:parseInt($('f_pval').value)||0,notes:$('f_pnotes').value.trim()};
  if(id){Object.assign(proj(c,id),data);}else{c.projects.push({id:uid(),...data,houseTypes:[]});}
  closeSheet();render();};
window.delProj=id=>{if(confirm('Delete this project?')){const c=cust(view.custId);c.projects=c.projects.filter(p=>p.id!==id);closeSheet();openCust(c.id);}};

window.editHT=(id)=>{const c=cust(view.custId),p=proj(c,view.projId);const ht=id?(p.houseTypes||[]).find(h=>h.id===id):null;
  openSheet(`<h2>${ht?'Edit':'New'} house type</h2>
    <div class="field"><label>Type name</label><input id="f_hname" value="${ht?esc(ht.name):''}" placeholder="e.g. Tipe 45"></div>
    <div class="row2"><div class="field"><label>Number of units</label><input id="f_hunits" type="number" value="${ht?ht.units||'':''}" placeholder="e.g. 24"></div>
    <div class="field"><label>Value per unit (Rp) <span class="opt">optional</span></label><input id="f_hval" type="number" value="${ht?ht.valuePerUnit||'':''}"></div></div>
    <div class="field hint">Add the paints/colors used after saving.</div>
    <div class="btnrow"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn gold" style="flex:1" onclick="saveHT('${id||''}')">Save</button></div>`);};
window.saveHT=id=>{const c=cust(view.custId),p=proj(c,view.projId);const name=$('f_hname').value.trim();if(!name){$('f_hname').focus();return;}
  const data={name,units:parseInt($('f_hunits').value)||0,valuePerUnit:parseInt($('f_hval').value)||0};
  if(!p.houseTypes)p.houseTypes=[];
  if(id){Object.assign(p.houseTypes.find(h=>h.id===id),data);}else{p.houseTypes.push({id:uid(),...data,paints:[]});}
  closeSheet();render();};
window.delHT=id=>{if(confirm('Delete this house type?')){const c=cust(view.custId),p=proj(c,view.projId);p.houseTypes=p.houseTypes.filter(h=>h.id!==id);render();}};

window.addPaint=(htId)=>{
  openSheet(`<h2>Add paint / color</h2>
    <div class="field"><label>Product</label><input id="f_pp" placeholder="e.g. Jotashield Ultra Clean"></div>
    <div class="row2"><div class="field"><label>Color <span class="opt">optional</span></label><input id="f_pc" placeholder="e.g. 1624 / Antique White"></div>
    <div class="field"><label>Swatch <span class="opt">optional</span></label><input id="f_phex" type="color" value="#dddddd" style="height:44px;padding:4px"></div></div>
    <div class="field"><label>Qty per unit <span class="opt">optional — e.g. pails per house</span></label><input id="f_pq" type="number" step="0.1" placeholder="e.g. 2"></div>
    <div class="btnrow"><button class="btn" onclick="closeSheet()">Cancel</button><button class="btn gold" style="flex:1" onclick="savePaint('${htId}')">Add</button></div>`);};
window.savePaint=htId=>{const c=cust(view.custId),p=proj(c,view.projId);const ht=p.houseTypes.find(h=>h.id===htId);
  const product=$('f_pp').value.trim();if(!product){$('f_pp').focus();return;}
  if(!ht.paints)ht.paints=[];
  ht.paints.push({product,color:$('f_pc').value.trim(),colorHex:$('f_phex').value,qtyPerUnit:parseFloat($('f_pq').value)||0});
  closeSheet();render();};
window.delPaint=(htId,idx)=>{const c=cust(view.custId),p=proj(c,view.projId);const ht=p.houseTypes.find(h=>h.id===htId);ht.paints.splice(idx,1);render();};

/* ---------- EXPORT ---------- */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function csvCell(s){s=(s==null?'':''+s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
window.exportCSV=()=>{
  const rows=[['Customer','Cust Type','Contact','Phone','Cust Location','Project','Project Location','Date Won','Status','Project Est Value','House Type','Units','Value/Unit','House Type Total','Product','Color','Qty/Unit','Total Qty']];
  for(const c of DB.customers)for(const p of c.projects){
    const base=[c.name,c.custType,c.contact,c.phone,c.location,p.name,p.location,p.dateWon,p.status,projValue(p)];
    if(!(p.houseTypes||[]).length){rows.push([...base,'','','','','','','','']);continue;}
    for(const ht of p.houseTypes){
      const htTotal=(ht.units||0)*(ht.valuePerUnit||0);
      const hbase=[...base,ht.name,ht.units,ht.valuePerUnit,htTotal];
      if(!(ht.paints||[]).length){rows.push([...hbase,'','','','']);continue;}
      for(const pl of ht.paints)rows.push([...hbase,pl.product,pl.color,pl.qtyPerUnit,(pl.qtyPerUnit||0)*(ht.units||0)]);
    }
  }
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='project-records-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
};
window.exportJSON=()=>{const blob=new Blob([JSON.stringify(DB)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='project-records-backup.json';a.click();};
window.importJSON=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);save();goCustomers();}catch(x){alert('Bad file');}};r.readAsText(f);};i.click();};

render();
</script>
