<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jotun Pricelist</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F3EE; --surface: #FFFFFF; --border: #E2DDD4;
  --border2: #C8C3B8; --text: #1A1814; --muted: #7A756C;
  --dim: #B0AAA0; --input-bg: #FAFAF7;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

header { background: var(--text); padding: 18px 20px 16px; }
.header-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 3px; }
.header-sub { font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 0.3px; }

.search-bar { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 12px 16px; position: sticky; top: 0; z-index: 50; }
.search-input { width: 100%; background: var(--input-bg); border: 0.5px solid var(--border2); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 10px 14px; outline: none; border-radius: 10px; transition: border-color 0.15s; }
.search-input:focus { border-color: var(--text); }
.search-input::placeholder { color: var(--dim); }

.cat-tabs { display: flex; overflow-x: auto; background: var(--surface); border-bottom: 0.5px solid var(--border); scrollbar-width: none; padding: 0 12px; position: sticky; top: 57px; z-index: 49; }
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab { padding: 11px 14px; font-size: 12px; font-weight: 600; font-family: 'DM Sans', sans-serif; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; flex-shrink: 0; transition: all 0.12s; }
.cat-tab.active { color: var(--text); border-bottom-color: var(--text); }

main { max-width: 700px; margin: 0 auto; padding: 16px 16px 60px; }

.product-group { margin-bottom: 20px; }
.group-header { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding: 0 2px; }

.product-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
.product-card-header { padding: 12px 14px; border-bottom: 0.5px solid var(--border); background: var(--input-bg); }
.product-name { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.product-type { font-size: 11px; color: var(--muted); font-style: italic; }

.variant-row { display: flex; align-items: center; padding: 10px 14px; border-bottom: 0.5px solid var(--border); }
.variant-row:last-child { border-bottom: none; }
.variant-row:nth-child(even) { background: var(--input-bg); }
.variant-name { font-size: 12px; color: var(--muted); flex: 1; min-width: 80px; }
.pack-prices { display: flex; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
.pack-item { text-align: right; min-width: 72px; }
.pack-size { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.pack-price { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: var(--text); }
.pack-price.empty { color: var(--dim); font-size: 12px; font-weight: 400; }

.tinter-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-bottom: 0.5px solid var(--border); }
.tinter-row:last-child { border-bottom: none; }
.tinter-row:nth-child(even) { background: var(--input-bg); }
.tinter-name { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 500; color: var(--text); }
.tinter-price { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: var(--text); }
.tinter-unit { font-size: 10px; color: var(--dim); text-align: right; margin-top: 1px; }

.empty-search { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 13px; display: none; }
.ref-note { font-size: 10px; color: var(--dim); text-align: center; padding: 16px; line-height: 1.6; }
</style>
</head>

let currentCat = 'all';

function renderAll() {
  const list = document.getElementById('product-list');
  let html = '';

  for (const [catKey, catData] of Object.entries(DATA)) {
    if (catKey === 'tinter') continue;
    html += `<div class="product-group" data-cat="${catKey}"><div class="group-header">${catData.label}</div>`;
    for (const prod of catData.products) {
      const packSizes = [...new Set(prod.variants.flatMap(v => Object.keys(v.prices)))];
      html += `<div class="product-card" data-cat="${catKey}" data-search="${prod.name.toLowerCase()}">
        <div class="product-card-header">
          <div class="product-name">${prod.name}</div>
          ${prod.type ? `<div class="product-type">${prod.type}</div>` : ''}
        </div>`;
      for (const variant of prod.variants) {
        html += `<div class="variant-row">
          <div class="variant-name">${variant.name}</div>
          <div class="pack-prices">`;
        for (const sz of packSizes) {
          const price = variant.prices[sz];
          html += `<div class="pack-item">
            <div class="pack-size">${sz}</div>
            <div class="pack-price ${price ? '' : 'empty'}">${price ? fmt(price) : '—'}</div>
          </div>`;
        }
        html += `</div></div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  // Tinter
  const tinters = DATA.tinter.tinters;
  html += `<div class="product-group" data-cat="tinter">
    <div class="group-header">Multicolor Tinter · 1L per bottle</div>
    <div class="product-card" data-cat="tinter" data-search="tinter multicolor">`;
  for (const t of tinters) {
    html += `<div class="tinter-row">
      <div class="tinter-name">${t.name}</div>
      <div><div class="tinter-price">${fmt(t.price)}</div><div class="tinter-unit">/ bottle</div></div>
    </div>`;
  }
  html += `</div></div>`;
  list.innerHTML = html;
}

function filterCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('search').value = '';
  applyFilters();
}

function applyFilters() {
  const query = document.getElementById('search').value.toLowerCase().trim();
  const groups = document.querySelectorAll('.product-group');
  let anyVisible = false;
  groups.forEach(group => {
    const catMatch = currentCat === 'all' || currentCat === group.dataset.cat;
    if (!catMatch) { group.style.display = 'none'; return; }
    group.style.display = '';
    const cards = group.querySelectorAll('.product-card');
    let groupHasVisible = false;
    cards.forEach(card => {
      const match = !query || card.dataset.search.includes(query);
      card.style.display = match ? '' : 'none';
      if (match) { groupHasVisible = true; anyVisible = true; }
    });
    group.style.display = groupHasVisible ? '' : 'none';
  });
  document.getElementById('empty-search').style.display = anyVisible ? 'none' : 'block';
}

renderAll();
